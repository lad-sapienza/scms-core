version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Everything else, minor and patch together; majors arrive as separate PRs
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @astrojs/check has peer typescript ^5 || ^6; stay aligned with the sites
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
